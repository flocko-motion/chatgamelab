<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Playback-engine</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <header class="game-header">
        <div class="game-title">
          <strong id="title">…</strong>
        </div>
        <div class="game-tools">
          <button id="pictures" class="tool-toggle" type="button" aria-pressed="true" hidden>
            <svg class="tool-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="14" rx="2" /><circle cx="9" cy="10" r="1.6" /><path d="M5 17l4.5-4.5 3 3L15 13l4 4" /></svg>
            <span class="tool-label">Pictures</span>
          </button>
          <select id="theme" aria-label="Theme" title="Theme" hidden></select>
          <button id="insights-toggle" class="tool-toggle" type="button" aria-pressed="true" aria-controls="insights">
            <svg class="tool-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="6" r="2.2" /><circle cx="18" cy="12" r="2.2" /><circle cx="6" cy="18" r="2.2" /><path d="M8.1 6.9l7.8 4.2M8.1 17.1l7.8-4.2" /></svg>
            <span id="insights-label" class="tool-label">Insights</span>
          </button>
        </div>
      </header>
      <div id="props" class="statusbar" hidden></div>

      <section id="launch" class="launch-panel" hidden>
        <p id="launch-text" class="launch-text"></p>
        <div id="launch-actions" class="launch-actions"></div>
      </section>

      <form id="options" class="options-dialog" hidden>
        <h2 class="options-title">How do you want to play?</h2>
        <div id="options-offers" class="options-offers"></div>
        <p id="options-problem" class="options-problem" hidden></p>
        <button id="options-start" class="options-start" type="submit">Start the game</button>
      </form>

      <div class="scene-area">
        <div id="background" class="scene-bg" aria-hidden="true"></div>
        <div id="standing" class="standing-image" hidden></div>
        <div id="scroll" class="scene-scroll">
          <div class="scenes">
            <div id="feed" class="feed"></div>
          </div>
        </div>

        <div id="dock" class="scene-dock">
          <div id="thinking" class="typing" hidden>
            <span class="dots"><i></i><i></i><i></i></span>
            <span id="thinking-text">The story unfolds…</span>
          </div>
          <form id="compose" class="inline-input">
            <p id="notice" class="notice waiting">
              <span class="spinner" aria-hidden="true"></span>
              <span id="notice-text">Connecting…</span>
            </p>
            <div id="audio" class="audio-control" style="display: none">
              <button id="talk" class="audio-button" type="button" aria-label="Pause the conversation" title="Pause the conversation">
                <svg class="icon-mic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5a3 3 0 0 1 6 0v5a3 3 0 0 1-6 0z" /><path d="M5 10a7 7 0 0 0 14 0M8 21h8M12 17v4" /></svg>
                <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="7.5" y="5" width="3.5" height="14" rx="1.2" /><rect x="13" y="5" width="3.5" height="14" rx="1.2" /></svg>
              </button>
              <span id="audio-label" class="audio-label" aria-live="polite"></span>
            </div>
            <button id="hold" class="hold-button" type="button" style="display: none">
              <svg class="hold-ring" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="16" pathLength="1" /></svg>
              <svg class="icon-mic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5a3 3 0 0 1 6 0v5a3 3 0 0 1-6 0z" /><path d="M5 10a7 7 0 0 0 14 0M8 21h8M12 17v4" /></svg>
            </button>
            <div class="input-wrap">
              <input id="typed" type="text" placeholder="What do you do?" autocomplete="off" disabled />
              <button id="send" class="send" type="submit" aria-label="Send" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16l13-8z" /></svg>
              </button>
            </div>
          </form>
        </div>
      </div>
    </main>

    <div id="split" role="separator" aria-orientation="vertical" aria-label="Resize the panels"></div>

    <aside id="insights">
      <section class="insights-graph">
        <h2>pipeline</h2>
        <div id="graph"></div>
      </section>
      <section class="insights-feed">
        <h2 id="runs-title">What happened</h2>
        <ol id="runs" class="runs"></ol>
      </section>
      <section class="insights-details">
        <div class="details-head">
          <h2 id="details-title">usage</h2>
          <button id="details-close" class="details-close" type="button" aria-label="Close">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
          </button>
        </div>
        <div id="details"></div>
      </section>
    </aside>

    <div id="lightbox" class="lightbox" hidden>
      <img alt="" />
    </div>
  </body>
  <script type="module" src="main.js"></script>
</html>
