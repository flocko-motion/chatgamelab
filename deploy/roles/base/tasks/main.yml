---
- name: Install base packages
  ansible.builtin.apt:
    name:
      - ufw
      - fail2ban
      - unattended-upgrades
      - needrestart
      - curl
      - jq
      # Rootless podman: newuidmap/newgidmap set up the user namespace, pasta
      # is podman 5's rootless network.
      - uidmap
      - passt
      # The per-user D-Bus: systemd-run --user and the updater's user units
      # need the run user's session bus, which minimal images leave out.
      - dbus-user-session
    state: present
    update_cache: true
    cache_valid_time: 3600

# The one unprivileged user: it runs the stack and owns the database volume.
- name: Create the run user
  ansible.builtin.user:
    name: "{{ run_user }}"
    home: "{{ run_home }}"
    shell: /bin/bash
    create_home: true
    system: true

# Ansible's working directory when it acts as the run user.
- name: Create the run user's ansible directory
  ansible.builtin.file:
    path: "{{ run_home }}/.ansible/tmp"
    state: directory
    owner: "{{ run_user }}"
    group: "{{ run_user }}"
    mode: "0700"

- name: Ensure the subordinate id files exist
  ansible.builtin.copy:
    dest: "{{ item }}"
    content: ""
    owner: root
    group: root
    mode: "0644"
    force: false
  loop:
    - /etc/subuid
    - /etc/subgid

- name: Read the subordinate ranges already assigned
  ansible.builtin.slurp:
    src: /etc/subuid
  register: subuid_file

# Checked against the file: usermod --add-subuids appends a second range on
# every run otherwise. The colon keeps "cgl" from matching "cgl-build".
- name: Give the run user a subordinate uid/gid range
  ansible.builtin.command: >
    usermod --add-subuids 200000-265535 --add-subgids 200000-265535 {{ run_user }}
  when: (run_user ~ ':') not in (subuid_file.content | b64decode)
  changed_when: true

- name: Read the run user's uid
  ansible.builtin.getent:
    database: passwd
    key: "{{ run_user }}"

- name: Hold the uid for the other roles
  ansible.builtin.set_fact:
    run_uid: "{{ ansible_facts['getent_passwd'][run_user][1] }}"

# User units run with nobody logged in.
- name: Enable lingering for the run user
  ansible.builtin.command: "loginctl enable-linger {{ run_user }}"
  changed_when: false

# The run user's manager starts with lingering. Its session bus comes from
# dbus-user-session; a manager that started before the package was there gets
# the bus by starting its socket, so a running stack stays up.
- name: Wait for the run user's manager
  ansible.builtin.wait_for:
    path: "/run/user/{{ run_uid }}/systemd/private"
    timeout: 60

- name: Start the run user's session bus
  ansible.builtin.systemd_service:
    name: dbus.socket
    scope: user
    state: started
  become: true
  become_user: "{{ run_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ run_uid }}"

- name: Check the run user's session bus
  ansible.builtin.wait_for:
    path: "/run/user/{{ run_uid }}/bus"
    timeout: 30

- name: Authorize the instance's SSH keys for the run user
  ansible.posix.authorized_key:
    user: "{{ run_user }}"
    key: "{{ ssh_keys | join('\n') }}"
    exclusive: true

- name: Harden sshd
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/99-hardening.conf
    content: |
      PasswordAuthentication no
      PermitRootLogin prohibit-password
      MaxAuthTries 3
      X11Forwarding no
      AllowTcpForwarding no
      ClientAliveInterval 300
      ClientAliveCountMax 2
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: reload sshd

# Services patched by unattended-upgrades restart at once.
- name: Restart patched services automatically
  ansible.builtin.copy:
    dest: /etc/needrestart/conf.d/50-autorestart.conf
    content: |
      $nrconf{restart} = 'a';
    mode: "0644"

# journald keeps logs across reboots when this directory exists.
- name: Keep the journal across reboots
  ansible.builtin.file:
    path: /var/log/journal
    state: directory
    mode: "0755"
  notify: restart journald

- name: Allow SSH, HTTP and HTTPS
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
  loop: ["22", "80", "443"]

- name: Enable the firewall, incoming denied by default
  community.general.ufw:
    state: enabled
    policy: deny

- name: Enable unattended-upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";
    mode: "0644"

# Security updates; a kernel update reboots at 03:00 and the stack comes back
# through the podman role's boot unit.
- name: Configure unattended-upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    content: |
      Unattended-Upgrade::Origins-Pattern {
              "origin=Debian,codename=${distro_codename},label=Debian";
              "origin=Debian,codename=${distro_codename},label=Debian-Security";
              "origin=Debian,codename=${distro_codename}-security,label=Debian-Security";
      };
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
      Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-Time "03:00";
    mode: "0644"

# The box's IPv6 address, for providers that assign one and announce it
# neither by DHCPv6 nor by router advertisement. A netplan drop-in under the
# id of the interface's existing definition adds address and route to it.
- name: Read the netplan definitions
  ansible.builtin.command: netplan get ethernets
  register: netplan_ethernets
  changed_when: false
  failed_when: false
  when: ipv6_address | default('') | length > 0

- name: Pick the definition the IPv6 address joins
  ansible.builtin.set_fact:
    ipv6_netplan_id: >-
      {{ ipv6_netplan_id | default((netplan_ethernets.stdout | from_yaml | default({}, true)).keys() | list | first
         if (netplan_ethernets.stdout | from_yaml | default({}, true)) | length == 1 else '') }}
  when: ipv6_address | default('') | length > 0

- name: Refuse an IPv6 address without one netplan definition to join
  ansible.builtin.assert:
    that:
      - netplan_ethernets.rc == 0
      - ipv6_netplan_id | length > 0
    fail_msg: >-
      ipv6_address is set, and the box has {{ 'no netplan' if netplan_ethernets.rc != 0
      else 'more than one netplan definition' }}. With netplan, name the
      definition of the public interface as ipv6_netplan_id (see `netplan get
      ethernets` on the box); without netplan, configure IPv6 on the box by hand.
  when: ipv6_address | default('') | length > 0

- name: Add the IPv6 address
  ansible.builtin.copy:
    dest: /etc/netplan/60-ipv6.yaml
    content: |
      # Managed by deploy/roles/base (ipv6_address in the instance file).
      network:
        version: 2
        ethernets:
          {{ ipv6_netplan_id }}:
            addresses:
              - "{{ ipv6_address if '/' in ipv6_address else ipv6_address ~ '/128' }}"
            routes:
              - to: "::/0"
                via: "{{ ipv6_gateway | default('fe80::1') }}"
                on-link: true
    owner: root
    group: root
    mode: "0600"
  register: ipv6_netplan
  when: ipv6_address | default('') | length > 0

- name: Apply it
  ansible.builtin.command: netplan apply
  when:
    - ipv6_address | default('') | length > 0
    - ipv6_netplan is changed
