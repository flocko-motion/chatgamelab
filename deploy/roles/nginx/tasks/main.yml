---
- name: Install nginx and certbot
  ansible.builtin.apt:
    name:
      - nginx
      - certbot
      - python3-certbot-nginx
    state: present

# The shared password in front of the site, when the instance file names a
# user. Only its hash reaches the box; it is written when --basic-auth gives
# a password, and kept otherwise.
- name: Look for the password file
  ansible.builtin.stat:
    path: "/etc/nginx/htpasswd-{{ inventory_hostname }}"
  register: htpasswd_file
  when: basic_auth_user | default('') | length > 0

- name: Refuse a password protection without a password
  ansible.builtin.assert:
    that: htpasswd_file.stat.exists or (basic_auth_password | default('') | length > 0)
    fail_msg: >-
      basic_auth_user is set, and the box has no password for it yet. Run once
      with --basic-auth, which asks for the password.
  when: basic_auth_user | default('') | length > 0

- name: Read the stored password hash
  ansible.builtin.slurp:
    src: "/etc/nginx/htpasswd-{{ inventory_hostname }}"
  register: htpasswd_current
  no_log: true
  when:
    - basic_auth_user | default('') | length > 0
    - basic_auth_password | default('') | length > 0
    - htpasswd_file.stat.exists

# With the stored hash's salt, an unchanged password gives the same hash, so
# the file stays as it is and nginx is not reloaded.
- name: Hash the password
  ansible.builtin.command:
    cmd: >-
      openssl passwd -6 -stdin
      {{ '-salt ' ~ stored_salt if stored_salt | length > 0 else '' }}
    stdin: "{{ basic_auth_password }}"
  vars:
    stored_line: "{{ (htpasswd_current.content | default('') | b64decode).strip() }}"
    stored_salt: >-
      {{ stored_line.split(':', 1)[1].split('$')[2]
         if stored_line.startswith(basic_auth_user ~ ':$6$') else '' }}
  register: basic_auth_hash
  changed_when: false
  no_log: true
  when:
    - basic_auth_user | default('') | length > 0
    - basic_auth_password | default('') | length > 0

- name: Write the password file
  ansible.builtin.copy:
    dest: "/etc/nginx/htpasswd-{{ inventory_hostname }}"
    content: "{{ basic_auth_user }}:{{ basic_auth_hash.stdout }}\n"
    owner: root
    group: www-data
    mode: "0640"
  no_log: true
  notify: reload nginx
  when:
    - basic_auth_user | default('') | length > 0
    - basic_auth_password | default('') | length > 0

- name: Remove the password file when the protection is off
  ansible.builtin.file:
    path: "/etc/nginx/htpasswd-{{ inventory_hostname }}"
    state: absent
  when: basic_auth_user | default('') | length == 0

- name: Template the vhost
  ansible.builtin.template:
    src: site.conf.j2
    dest: "/etc/nginx/sites-available/{{ inventory_hostname }}.conf"
    mode: "0644"
  notify: reload nginx

- name: Enable the vhost
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ inventory_hostname }}.conf"
    dest: "/etc/nginx/sites-enabled/{{ inventory_hostname }}.conf"
    state: link
  notify: reload nginx

- name: Remove the default site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: reload nginx

- name: Run nginx
  ansible.builtin.systemd_service:
    name: nginx
    enabled: true
    state: started

# nginx serves plain HTTP before certbot asks for the certificate.
- name: Apply the vhost
  ansible.builtin.meta: flush_handlers

# certbot adds the TLS directives to the templated vhost on every run and
# skips issuance while the certificate is valid.
- name: Issue or renew the certificate
  ansible.builtin.command:
    cmd: >
      certbot --nginx
      -d {{ inventory_hostname }}
      --non-interactive --agree-tos -m {{ certbot_email }}
      --redirect
  register: certbot_result
  changed_when: "'Certificate not yet due for renewal' not in certbot_result.stdout"
