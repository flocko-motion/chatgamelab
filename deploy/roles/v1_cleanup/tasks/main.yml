---
# A box set up for chatgamelab 1.x (by the 1.x deploy repository) carries its
# deploy clone in /opt/chatgamelab. Converting it removes the 1.x stack with
# its database, its units, the build user and the 1.x files; the directory
# goes last, so a run that fails halfway converts again next time and a
# converted box skips all of this.
- name: Look for a chatgamelab 1.x setup
  ansible.builtin.stat:
    path: /opt/chatgamelab
  register: v1_setup

- name: Convert a chatgamelab 1.x box
  when: v1_setup.stat.exists
  block:
    # What the instance file has to take over from 1.x: the Sentry DSNs, and
    # the backup target when 1.x backs up. Missing is a required one the file
    # leaves empty; the message then lists every 1.x value, to copy as a set.
    # The run stops before anything changes; the 1.x files go only once the
    # file holds them.
    - name: Compare the 1.x settings with the instance file
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import json, sys
            path, settings, required, instance = sys.argv[1], *map(json.loads, sys.argv[2:])
            env = {}
            try:
                for line in open(path):
                    key, sep, value = line.rstrip("\n").partition("=")
                    if sep:
                        env[key] = value
            except FileNotFoundError:
                pass
            backup_on = env.get("BACKUP_ENABLED") == "true"
            wanted = {k: env[v] for k, v in settings.items()
                      if env.get(v) and (backup_on or not k.startswith("backup_"))}
            missing = [k for k in required if k in wanted and str(instance.get(k, "")) == ""]
            print(json.dumps({"wanted": wanted, "missing": missing}))
          - "{{ run_home }}/env.secret"
          - "{{ v1_settings | to_json }}"
          - "{{ v1_required | to_json }}"
          - "{{ dict(v1_settings.keys() | list | zip(query('vars', *(v1_settings.keys() | list), default=''))) | to_json }}"
      register: v1_compare
      changed_when: false
      no_log: true

    - name: Stop until the instance file holds the 1.x settings
      ansible.builtin.fail:
        msg: |-
          This box runs chatgamelab 1.x with settings the instance file
          {{ inventory_hostname }}.yml leaves empty. Nothing on the box has
          changed. Add these lines to the file, then run again:

          {% for k, v in (v1_compare.stdout | from_json).wanted.items() %}
          {{ k }}: {{ v | to_json }}
          {% endfor %}
      when: (v1_compare.stdout | from_json).missing | length > 0

    - name: Stop and disable the 1.x units
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: stopped
        enabled: false
      loop: &v1_units
        - cgl-stack.service
        - cgl-backup.timer
        - cgl-backup.service
        - cgl-update.timer
        - cgl-update.path
        - cgl-update.service
        - cgl-hook.service
        - cgl-build-prune.timer
        - cgl-build-prune.service
      failed_when: false

    - name: Remove the 1.x unit files
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ item }}"
        state: absent
      loop: *v1_units

    - name: Remove the 1.x helpers
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/tmpfiles.d/cgl-deploy.conf
        - /usr/local/bin/cgl-deploy-hook
        - /etc/sudoers.d/50-cgl-build
        - /run/cgl-deploy
        - /var/tmp/cgl-handoff

    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true

    # The 1.x containers carry the names the app's stack uses.
    - name: Remove the 1.x containers
      ansible.builtin.command: podman rm --force --ignore chatgamelab-db chatgamelab-backend chatgamelab-web
      become: true
      become_user: "{{ run_user }}"
      environment: &run_env
        XDG_RUNTIME_DIR: "/run/user/{{ run_uid }}"
      changed_when: true

    # The 1.x compose project is named after its directory, "deploy".
    - name: Find the 1.x volumes
      ansible.builtin.command: podman volume ls --quiet --filter label=com.docker.compose.project=deploy
      become: true
      become_user: "{{ run_user }}"
      environment: *run_env
      register: v1_volumes
      changed_when: false

    - name: Remove the 1.x volumes, the 1.x database with them
      ansible.builtin.command: "podman volume rm {{ v1_volumes.stdout_lines | join(' ') }}"
      become: true
      become_user: "{{ run_user }}"
      environment: *run_env
      when: v1_volumes.stdout_lines | length > 0
      changed_when: true

    - name: Remove the 1.x images and networks
      ansible.builtin.command: "{{ item }}"
      become: true
      become_user: "{{ run_user }}"
      environment: *run_env
      loop:
        - podman image prune --all --force
        - podman network prune --force
      changed_when: true

    - name: Remove the 1.x build user and its home
      ansible.builtin.user:
        name: cgl-build
        state: absent
        remove: true

    # The SFTP backup key carries over, so the instance keeps backing up to
    # the same target without --backup-key.
    - name: Look for the 1.x backup key
      ansible.builtin.stat:
        path: "{{ run_home }}/backup_key"
      register: v1_backup_key

    - name: Create the app's config directory
      ansible.builtin.file:
        path: "{{ run_home }}/.chatgamelab/etc"
        state: directory
        owner: "{{ run_user }}"
        group: "{{ run_user }}"
        mode: "0700"
      when: v1_backup_key.stat.exists and v1_backup_key.stat.size > 0

    - name: Carry the backup key over
      ansible.builtin.copy:
        src: "{{ run_home }}/backup_key"
        dest: "{{ run_home }}/.chatgamelab/etc/backup_key"
        remote_src: true
        owner: "{{ run_user }}"
        group: "{{ run_user }}"
        mode: "0600"
        force: false
      when: v1_backup_key.stat.exists and v1_backup_key.stat.size > 0

    - name: Remove the run user's 1.x files
      ansible.builtin.file:
        path: "{{ run_home }}/{{ item }}"
        state: absent
      loop:
        - env.config
        - env.secret
        - backup_key
        - hook-secret
        - deployed-ref
        - .ground-hash

    - name: Remove the 1.x deploy clone, last
      ansible.builtin.file:
        path: /opt/chatgamelab
        state: absent
