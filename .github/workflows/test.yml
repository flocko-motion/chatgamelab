name: Tests

on:
  pull_request:
    branches:
      - development

jobs:
  migration-numbers:
    name: Migration Numbers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The server tracks migrations by version number alone (db/init.go), so a
      # second file with an already used number never runs on a database that
      # is past it, and a file without a numeric prefix is skipped with a warning.
      # pull_request checks out the merge with development, which catches two
      # branches that each picked the same next number.
      - name: Every migration has a unique number
        working-directory: ./server/db/migrations
        run: |
          status=0
          for f in *.sql; do
            if ! [[ "$f" =~ ^[0-9]+_.+\.sql$ ]]; then
              echo "::error file=server/db/migrations/$f::migration name must start with a number followed by an underscore"
              status=1
            fi
          done
          dupes=$(ls *.sql | grep -E '^[0-9]+_' | awk -F_ '{print $1+0}' | sort -n | uniq -d)
          for n in $dupes; do
            files=$(ls *.sql | awk -F_ -v n="$n" '$1+0 == n' | tr '\n' ' ')
            echo "::error::migration number $n is used more than once: $files"
            status=1
          done
          exit $status

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Install dependencies
        run: go mod download
        working-directory: ./server

      - name: Run tests (excluding AI tests)
        id: tests
        run: ./run-test.sh --no-ai
        
      - name: Test Summary
        if: always()
        run: |
          if [ "${{ steps.tests.outcome }}" == "success" ]; then
            echo "✅ All backend tests passed!"
            echo "## ✅ Backend Test Results" >> $GITHUB_STEP_SUMMARY
            echo "All backend tests passed successfully." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Backend tests failed!"
            echo "## ❌ Backend Test Results" >> $GITHUB_STEP_SUMMARY
            echo "Backend tests failed. Please fix the issues before merging." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

  frontend-checks:
    name: Frontend Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ./web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./web

      - name: TypeScript type check
        id: typecheck
        run: npx tsc -b
        working-directory: ./web

      - name: Build check
        id: build
        run: npm run build
        working-directory: ./web

      - name: Frontend Summary
        if: always()
        run: |
          if [ "${{ steps.typecheck.outcome }}" == "success" ] && [ "${{ steps.build.outcome }}" == "success" ]; then
            echo "✅ Frontend checks passed!"
            echo "## ✅ Frontend Check Results" >> $GITHUB_STEP_SUMMARY
            echo "TypeScript and build checks passed successfully." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Frontend checks failed!"
            echo "## ❌ Frontend Check Results" >> $GITHUB_STEP_SUMMARY
            if [ "${{ steps.typecheck.outcome }}" != "success" ]; then
              echo "- TypeScript type check failed" >> $GITHUB_STEP_SUMMARY
            fi
            if [ "${{ steps.build.outcome }}" != "success" ]; then
              echo "- Build failed" >> $GITHUB_STEP_SUMMARY
            fi
            exit 1
          fi

  test:
    name: Run Tests
    needs: [migration-numbers, backend-tests, frontend-checks]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.migration-numbers.result }}" == "success" ] && [ "${{ needs.backend-tests.result }}" == "success" ] && [ "${{ needs.frontend-checks.result }}" == "success" ]; then
            echo "✅ All checks passed!"
            exit 0
          else
            echo "❌ Some checks failed!"
            exit 1
          fi
