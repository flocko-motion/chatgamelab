name: Tests

on:
  pull_request:
    branches:
      - v2/development

jobs:
  # Whether the pull request touches anything the app is built from. Changes
  # to the tooling list alone (the roadmap tool, the homepage, documentation)
  # skip the checks below; "Run Tests" still reports, so the required check
  # passes.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          tooling='^(roadmap/.*|homepage/.*|\.github/workflows/roadmap\.yml|docs/.*|.*\.md)$'
          rest=$(git diff --name-only "$BASE...$HEAD" | grep -Ev "$tooling" || true)
          if [ -n "$rest" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "Changes beyond tooling:"; echo "$rest"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Only tooling changed; the checks are skipped."
          fi

  backend-tests:
    name: Backend Tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ./go/go.mod
          cache: true

      - name: Install dependencies
        run: go mod download
        working-directory: ./go

      # The module's own tests, among them the core's boundary test (only the
      # core reaches the database) and its gate coverage.
      - name: Unit tests
        run: go test ./...
        working-directory: ./go

      - name: Run tests (excluding AI tests)
        id: tests
        run: scripts/test.sh
        
      - name: Test Summary
        if: always()
        run: |
          if [ "${{ steps.tests.outcome }}" == "success" ]; then
            echo "✅ All backend tests passed!"
            echo "## ✅ Backend Test Results" >> $GITHUB_STEP_SUMMARY
            echo "All backend tests passed successfully." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Backend tests failed!"
            echo "## ❌ Backend Test Results" >> $GITHUB_STEP_SUMMARY
            echo "Backend tests failed. Please fix the issues before merging." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

  frontend-checks:
    name: Frontend Checks
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./frontend

      - name: TypeScript type check
        id: typecheck
        run: npx tsc -b
        working-directory: ./frontend

      - name: Build check
        id: build
        run: npm run build
        working-directory: ./frontend

      - name: Frontend Summary
        if: always()
        run: |
          if [ "${{ steps.typecheck.outcome }}" == "success" ] && [ "${{ steps.build.outcome }}" == "success" ]; then
            echo "✅ Frontend checks passed!"
            echo "## ✅ Frontend Check Results" >> $GITHUB_STEP_SUMMARY
            echo "TypeScript and build checks passed successfully." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Frontend checks failed!"
            echo "## ❌ Frontend Check Results" >> $GITHUB_STEP_SUMMARY
            if [ "${{ steps.typecheck.outcome }}" != "success" ]; then
              echo "- TypeScript type check failed" >> $GITHUB_STEP_SUMMARY
            fi
            if [ "${{ steps.build.outcome }}" != "success" ]; then
              echo "- Build failed" >> $GITHUB_STEP_SUMMARY
            fi
            exit 1
          fi

  translations:
    name: Translations
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ./translation/go.mod
          cache: false

      - name: Check every UI text is translated
        run: make translate-check

  # Whether the generated files match their inputs. Two pull requests can
  # each be current on their own and stale together; the required check runs
  # on the branch brought up to date, so the second one fails here instead of
  # the release build.
  codegen:
    name: Generated Files
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      SCHEMAF_RUNTIME: docker

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Regenerate
        run: ./schemaf.sh codegen

      - name: Check nothing changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::generated files are stale — run ./schemaf.sh codegen and commit"
            git status --short
            git diff
            exit 1
          fi

  test:
    name: Run Tests
    needs: [changes, backend-tests, frontend-checks, translations, codegen]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.changes.result }}" == "success" ] && [ "${{ needs.changes.outputs.code }}" == "false" ]; then
            echo "✅ Only tooling changed; nothing to check."
            exit 0
          fi
          if [ "${{ needs.backend-tests.result }}" == "success" ] && [ "${{ needs.frontend-checks.result }}" == "success" ] && [ "${{ needs.translations.result }}" == "success" ] && [ "${{ needs.codegen.result }}" == "success" ]; then
            echo "✅ All checks passed!"
            exit 0
          else
            echo "❌ Some checks failed!"
            exit 1
          fi
