name: Merge policy

# v2/main is the 2.X release line, and it is reached only by releasing
# v2/development. A pull request from anywhere else would put a commit onto
# the release line that never sat in v2/development first.
on:
  pull_request_target:
    branches:
      - v2/main
    types: [opened, reopened, synchronize, edited]

permissions: {}

jobs:
  merge-policy:
    # One name on every line, so a ruleset can require it once for all of them.
    name: merge-policy
    runs-on: ubuntu-latest
    steps:
      # pull_request_target runs v2/main's copy of this file, which a pull
      # request cannot edit. A fork can still call its own branch
      # "v2/development", which is what the repository comparison catches.
      - name: v2/main takes v2/development and nothing else
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ] || [ "$HEAD_REF" != "v2/development" ]; then
            echo "v2/main takes pull requests from v2/development only;"
            echo "this one comes from $HEAD_REPO:$HEAD_REF"
            exit 1
          fi
