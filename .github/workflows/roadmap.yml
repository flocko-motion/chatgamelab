# Builds the project's Pages site and deploys it: the homepage (homepage/) at
# the root, the interactive roadmap (roadmap/), rebuilt from the issues, under
# /roadmap/. A push that changes either deploys it too. Issue events only run
# workflows from the default branch, so this lives on v2/development. GitHub
# sends no event when a "blocked by" relation changes; the daily run and
# `make roadmap` cover that.
name: Roadmap

on:
  issues:
    types: [opened, edited, closed, reopened, deleted, transferred,
            labeled, unlabeled, assigned, unassigned, milestoned, demilestoned]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [v2/development]
    paths: [homepage/**, roadmap/**, .github/workflows/roadmap.yml]

permissions:
  contents: read
  issues: read
  pages: write      # the site is deployed to GitHub Pages
  id-token: write

# A running build finishes; a newer one waits behind it (GitHub keeps the
# newest waiting run per group), so no build is cut off halfway.
concurrency:
  group: roadmap
  cancel-in-progress: false

jobs:
  roadmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site/roadmap
          cp homepage/* frontend/public/og-image.png frontend/public/favicon.png site/
          python3 roadmap/roadmap.py "${{ github.repository }}" > site/roadmap/roadmap.json
          cp roadmap/index.html site/roadmap/

      - name: Hand the site to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # The homepage, and the roadmap page with its roadmap.json.
  pages:
    needs: roadmap
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
