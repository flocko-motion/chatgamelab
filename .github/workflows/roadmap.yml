# Rebuilds the interactive roadmap from the issues (roadmap/) and deploys it to Pages.
# Issue events only run workflows from the default branch, so this lives on
# v2/development. GitHub sends no event when a "blocked by" relation or a sub-issue
# changes; the daily run, `make roadmap` and the page's Update button cover that.
name: Roadmap

on:
  issues:
    types: [opened, edited, closed, reopened, deleted, transferred,
            labeled, unlabeled, assigned, unassigned, milestoned, demilestoned]
  # A milestone's due date orders the phases, its title labels a bar.
  milestone:
    types: [created, edited, opened, closed, deleted]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pages: write      # the interactive page is deployed to GitHub Pages
  id-token: write

# A running build finishes; a newer one waits behind it (GitHub keeps the
# newest waiting run per group), so no build is cut off halfway.
concurrency:
  group: roadmap
  cancel-in-progress: false

jobs:
  roadmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build the page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site
          python3 roadmap/roadmap.py "${{ github.repository }}" > site/roadmap.json
          cp roadmap/index.html site/

      - name: Hand the interactive page to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # The interactive page: roadmap/index.html with roadmap.json.
  pages:
    needs: roadmap
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
