# Rebuilds the wiki page Roadmap from the issues (scripts/roadmap.py).
# Issue events only run workflows from the default branch, so this lives on
# v2/development. GitHub sends no event when a "blocked by" relation changes; the
# daily run and `make roadmap` cover that.
name: Roadmap

on:
  issues:
    types: [opened, edited, closed, reopened, deleted, transferred,
            labeled, unlabeled, assigned, unassigned, milestoned, demilestoned]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write   # the wiki is pushed with the workflow's token
  issues: read
  pages: write      # the interactive page is deployed to GitHub Pages
  id-token: write

# A running build finishes; a newer one waits behind it (GitHub keeps the
# newest waiting run per group), so no build is cut off halfway.
concurrency:
  group: roadmap
  cancel-in-progress: false

jobs:
  roadmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Render the page
        env:
          GH_TOKEN: ${{ github.token }}
          ROADMAP_JSON: site/roadmap.json
        run: |
          mkdir -p site
          python3 scripts/roadmap.py "${{ github.repository }}" > Roadmap.md
          cp scripts/roadmap-site/index.html site/

      - name: Push it to the wiki
        env:
          TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.wiki.git" wiki
          cp Roadmap.md wiki/Roadmap.md
          cd wiki
          if git diff --quiet; then
            echo "Roadmap unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Roadmap: rebuilt from the issues"
          git push

      - name: Hand the interactive page to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # The interactive page: scripts/roadmap-site/index.html with roadmap.json.
  pages:
    needs: roadmap
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
