# The instances deployed from chatgamelab-deploy: development on a merge to
# development, production on a merge to main.
#
# No build here, deliberately. That box builds from source itself, which is
# what lets it run any commit rather than only the ones a registry holds — so
# a merge to development needs nothing from CI but a nudge. Quality is gated
# before the merge, by test.yml on the pull request.
#
# The trigger carries no instruction. The listener reads the body only to hash
# it and then asks the box to converge on the branch it already tracks, so a
# forged or replayed trigger buys one convergence onto development — which the
# box's own 15-minute timer was going to do anyway. Nothing on the box is
# issued to CI: no SSH key, no deploy credential, only this shared HMAC
# secret, which ./deploy.sh mints fresh on every run and writes to both ends.
name: Deploy instances

on:
  push:
    branches:
      - development
      - main
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the box that follows this branch
        env:
          # Per instance, so two boxes following two branches do not share one
          # pair. Both are written by ./deploy.sh in chatgamelab-deploy, which
          # is also why moving an instance to another domain needs no edit here.
          SECRET: ${{ github.ref_name == 'main'
            && secrets.CGL_HOOK_SECRET_RUN_CHATGAMELAB_EU
            || secrets.CGL_HOOK_SECRET_DEV_CGL_FMNOEL_DE }}
          URL: ${{ github.ref_name == 'main'
            && vars.CGL_HOOK_URL_RUN_CHATGAMELAB_EU
            || vars.CGL_HOOK_URL_DEV_CGL_FMNOEL_DE }}
        run: |
          # A body is sent because a POST without one carries no Content-Length,
          # which the listener answers 411 before looking at anything.
          body='{"ref":"${{ github.ref_name }}","sha":"${{ github.sha }}"}'
          sig="$(printf '%s' "$body" \
            | openssl dgst -sha256 -hmac "$SECRET" -r | cut -d' ' -f1)"
          # An accepted trigger answers 202, not 200: the deploy it starts
          # outlives the request by minutes. curl -f takes any 2xx.
          if [ -z "$URL" ]; then
            echo "::warning::no hook URL for ${{ github.ref_name }} — run ./deploy.sh once against that instance to set it"
            exit 0
          fi
          # Non-fatal by design: a dead trigger costs a deploy its promptness
          # and nothing else, since the box's own timer converges regardless. A
          # warning annotation rather than a log line, so it shows on the run
          # summary instead of hiding in a green step.
          curl -fsS -X POST \
            -H 'Content-Type: application/json' \
            -H "X-Hub-Signature-256: sha256=$sig" \
            --data-raw "$body" \
            "$URL" \
            || echo "::warning::trigger to $URL failed — the box's 15-minute timer still converges"
