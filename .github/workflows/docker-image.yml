name: Build and Push Docker Images

# main only. Its images are what production deploys, and production is the
# only consumer: the development instance (cgl.fmnoel.de) builds from source on
# the box, so it can run any commit rather than only the ones published here.
# Quality is gated before the merge by test.yml, on the pull request.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref to build from (branch, tag or SHA)"
        required: true
        default: "main"
        type: string
      reason:
        description: "Reason for manual build"
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/chatgamelab

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Display build info
        run: |
          echo "🚀 Build triggered"
          echo "📂 Ref: ${{ github.event.inputs.ref || github.ref_name }}"
          echo "💬 Reason: ${{ github.event.inputs.reason || 'push' }}"
          echo "👤 Triggered by: ${{ github.actor }}"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.inputs.ref || github.ref_name }}

      - name: Resolve version
        id: main_version
        run: |
          npm install -g semantic-release @semantic-release/github @semantic-release/exec
          npx semantic-release > /tmp/release.log 2>&1 || true
          cat /tmp/release.log

          # Extract published version
          VERSION=$(grep -oP 'Published release \K[0-9]+\.[0-9]+\.[0-9]+' /tmp/release.log | tail -1)

          if [ -z "$VERSION" ]; then
            # No new release — use latest stable tag
            VERSION=$(git tag -l "v[0-9]*.[0-9]*.[0-9]*" --sort=-version:refname | grep -v -- '-' | head -n1 | sed 's/^v//')
            echo "No new release, using existing tag: $VERSION"
          else
            echo "New version published: $VERSION"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set final version output
        id: version
        run: echo "version=${{ steps.main_version.outputs.version }}" >> $GITHUB_OUTPUT


  build-and-push:
    needs: resolve-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service:
          - name: backend
            context: .
            dockerfile: ./server/Dockerfile
          - name: web
            context: ./web
            dockerfile: ./web/Dockerfile
          - name: db
            context: .
            dockerfile: ./docker/db/Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tags
        id: tags
        run: |
          SERVICE_NAME="${{ matrix.service.name }}"
          BRANCH_NAME="${{ github.ref_name }}"
          VERSION="${{ needs.resolve-version.outputs.version }}"
          if [ "$VERSION" != "no-release" ]; then
            echo "- \`${{ env.IMAGE_PREFIX }}-backend:${VERSION}\`" >> $GITHUB_STEP_SUMMARY
            echo "- \`${{ env.IMAGE_PREFIX }}-web:${VERSION}\`" >> $GITHUB_STEP_SUMMARY
            echo "- \`${{ env.IMAGE_PREFIX }}-db:${VERSION}\`" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- \`${{ env.IMAGE_PREFIX }}-backend:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.IMAGE_PREFIX }}-web:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.IMAGE_PREFIX }}-db:latest\`" >> $GITHUB_STEP_SUMMARY

          # Base image name
          IMAGE_NAME="${{ env.IMAGE_PREFIX }}-${SERVICE_NAME}"

          # Initialize tags array
          TAGS=""

          # Always add version tag (if we have one)
          if [ "$VERSION" != "no-release" ] && [ -n "$VERSION" ]; then
            TAGS="${IMAGE_NAME}:${VERSION}"
          fi

          # latest always, beside the version tag
          if [ -n "$TAGS" ]; then
            TAGS="${TAGS},${IMAGE_NAME}:latest"
          else
            TAGS="${IMAGE_NAME}:latest"
          fi

          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "Building tags: ${TAGS}"

      - name: Debug version
        run: |
          echo "Version: ${{ needs.resolve-version.outputs.version }}"

      - name: Build and push ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ needs.resolve-version.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
            org.opencontainers.image.version=${{ needs.resolve-version.outputs.version }}

  deploy-prod:
    # Coolify, until production moves to its own v-server deployed from
    # chatgamelab-deploy. The development instance is triggered by
    # deploy-dev.yml, which runs on its own branch and needs none of this.
    needs: [build-and-push, resolve-version]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify prod
        run: |
          curl -X POST -f \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_WEBHOOK_TOKEN }}" \
            "${{ secrets.COOLIFY_WEBHOOK_URL_PROD }}" || echo "⚠️ Coolify prod webhook failed"

  summary:
    needs: [build-and-push, resolve-version, deploy-prod]
    runs-on: ubuntu-latest
    steps:
      - name: Build summary
        run: |
          echo "## Docker Images Built and Pushed 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Release Version:** \`${{ needs.resolve-version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Images:" >> $GITHUB_STEP_SUMMARY

          VERSION="${{ needs.resolve-version.outputs.version }}"
          if [ "$VERSION" != "no-release" ]; then
            echo "- \`${{ env.IMAGE_PREFIX }}-backend:${VERSION}\`" >> $GITHUB_STEP_SUMMARY
            echo "- \`${{ env.IMAGE_PREFIX }}-web:${VERSION}\`" >> $GITHUB_STEP_SUMMARY
            echo "- \`${{ env.IMAGE_PREFIX }}-db:${VERSION}\`" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- \`${{ env.IMAGE_PREFIX }}-backend:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.IMAGE_PREFIX }}-web:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.IMAGE_PREFIX }}-db:latest\`" >> $GITHUB_STEP_SUMMARY
