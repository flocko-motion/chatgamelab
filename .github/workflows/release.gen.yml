# Code generated by schemaf codegen. DO NOT EDIT.
# Regenerate with: ./schemaf.sh codegen
#
# A pushed tag vX.Y.Z (a release) or vX.Y.Z-<pre> (a prerelease) builds the
# artifact, attests it with keyless Sigstore, attaches both to the tag's GitHub
# release and rebuilds the app's release index releases.json.
# See INSTALL.md › Releases from CI. Shell steps read their inputs from env only.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

# One run at a time, so two tags never rebuild releases.json at once.
concurrency:
  group: schemaf-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SCHEMAF_RUNTIME: docker
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      NAME: chatgamelab
    steps:
      - name: Check the tag
        id: version
        run: |
          set -euo pipefail
          num='(0|[1-9][0-9]*)' id='[0-9A-Za-z-]+'
          if [[ ! "$TAG" =~ ^v$num\.$num\.$num(-$id(\.$id)*)?$ ]]; then
            echo "::error::tag $TAG is not a release tag — use vX.Y.Z or vX.Y.Z-<pre>"
            exit 1
          fi
          version="${TAG#v}"
          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac
          {
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "artifact=$NAME-$version.run"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # git describe in the artifact's manifest needs the tags
          persist-credentials: false

      - name: Build the artifact
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARTIFACT: ${{ steps.version.outputs.artifact }}
        run: ./schemaf.sh build --tag "$VERSION" --output "$ARTIFACT"

      - name: Attest the artifact
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.version.outputs.artifact }}

      - name: Publish the release
        id: publish
        env:
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          ARTIFACT: ${{ steps.version.outputs.artifact }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          bundle="$ARTIFACT.sigstore.json"
          cp "$BUNDLE_PATH" "$bundle"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Created by hand first (e.g. for its notes): keep them, add the files.
            gh release upload "$TAG" "$ARTIFACT" "$bundle" --clobber
            gh release edit "$TAG" --prerelease="$PRERELEASE"
          else
            flags=(--verify-tag --title "$TAG" --generate-notes)
            if [ "$PRERELEASE" = true ]; then flags+=(--prerelease --latest=false); fi
            gh release create "$TAG" "${flags[@]}" "$ARTIFACT" "$bundle"
          fi

      - name: Rebuild releases.json
        id: index
        run: |
          set -euo pipefail
          # Every published release with a release tag and both files, rebuilt
          # from scratch on each run, so the index is always complete.
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" | jq -s --arg name "$NAME" '
            (add // [])
            | map(
                select(.draft | not)
                | select(.tag_name | test("^v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\\.[0-9A-Za-z-]+)*)?$"))
                | (.tag_name | ltrimstr("v")) as $v
                | ([.assets[] | {key: .name, value: .browser_download_url}] | from_entries) as $a
                | select($a["\($name)-\($v).run"] and $a["\($name)-\($v).run.sigstore.json"])
                | {
                    version: $v,
                    prerelease: ($v | contains("-")),
                    artifact: $a["\($name)-\($v).run"],
                    attestation: $a["\($name)-\($v).run.sigstore.json"],
                    notes: (.body // "")
                  })' > releases.json
          echo "releases.json lists $(jq length releases.json) release(s)"
          if ! gh release view schemaf-index >/dev/null 2>&1; then
            gh release create schemaf-index --latest=false --title "schemaf release index" \
              --notes "releases.json is this app's release index, rebuilt by release.gen.yml for every release tag (schemaf INSTALL.md › Releases from CI). Not a release of the app."
          fi
          gh release upload schemaf-index releases.json --clobber
