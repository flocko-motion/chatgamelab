<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Engine player</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <header>
        <button id="talk" type="button" disabled>hold to talk</button>
        <form id="compose">
          <input id="typed" type="text" placeholder="…or type" autocomplete="off" disabled />
        </form>
        <span id="state">idle</span>
      </header>
      <img id="scene" alt="" hidden />
      <div id="feed"></div>
    </main>

    <aside>
      <section>
        <h2>pipeline</h2>
        <div id="graph"></div>
      </section>
      <section>
        <h2>status</h2>
        <div id="props" class="kv"></div>
      </section>
      <section>
        <h2>usage</h2>
        <div id="usage" class="kv"></div>
      </section>
    </aside>

    <dialog id="inspector">
      <div id="inspector-body"></div>
      <form method="dialog"><button type="submit">close</button></form>
    </dialog>
  </body>
  <script type="module" src="main.js"></script>
</html>
