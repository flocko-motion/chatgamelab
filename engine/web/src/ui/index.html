<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Engine player</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <header class="game-header">
        <div class="game-title">
          <strong id="title">…</strong>
        </div>
        <div class="game-tools">
          <select id="theme" aria-label="Theme" title="Theme"></select>
        </div>
      </header>
      <div id="props" class="statusbar" hidden></div>

      <div class="scene-area">
        <div id="background" class="scene-bg" aria-hidden="true"></div>
        <div id="standing" class="standing-image" hidden></div>
        <div id="scroll" class="scene-scroll">
          <div class="scenes">
            <div id="feed" class="feed"></div>
          </div>
        </div>

        <div id="dock" class="scene-dock">
          <div id="thinking" class="typing" hidden>
            <span class="dots"><i></i><i></i><i></i></span>
            <span id="thinking-text">The story unfolds…</span>
          </div>
          <form id="compose" class="inline-input">
            <p id="notice" class="notice"><span id="notice-text">Connecting…</span></p>
            <div id="audio" class="audio-control" style="display: none">
              <button id="talk" class="audio-button" type="button" aria-label="Pause the conversation" title="Pause the conversation">
                <svg class="icon-mic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5a3 3 0 0 1 6 0v5a3 3 0 0 1-6 0z" /><path d="M5 10a7 7 0 0 0 14 0M8 21h8M12 17v4" /></svg>
                <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="7.5" y="5" width="3.5" height="14" rx="1.2" /><rect x="13" y="5" width="3.5" height="14" rx="1.2" /></svg>
              </button>
              <span id="audio-label" class="audio-label" aria-live="polite"></span>
            </div>
            <div class="input-wrap">
              <input id="typed" type="text" placeholder="What do you do?" autocomplete="off" disabled />
              <button id="send" class="send" type="submit" aria-label="Send" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16l13-8z" /></svg>
              </button>
            </div>
          </form>
        </div>
      </div>
    </main>

    <div id="split" role="separator" aria-orientation="vertical" aria-label="Resize the panels"></div>

    <aside>
      <section>
        <h2>pipeline</h2>
        <div id="graph"></div>
      </section>
      <section>
        <h2 id="details-title">usage</h2>
        <div id="details"></div>
      </section>
    </aside>

    <div id="lightbox" class="lightbox" hidden>
      <img alt="" />
    </div>
  </body>
  <script type="module" src="main.js"></script>
</html>
